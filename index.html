<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>홀덤 로그</title>
  <meta name="description" content="토너먼트 일정·결과, 뱅크롤, 새틀라이트 티켓, 핸드 메모를 기록하는 개인용 홀덤 앱">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view" class="view"></main>

  <button id="fab" class="fab" type="button" aria-label="대회 추가">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="메인 메뉴">
    <button type="button" class="tab" data-tab="home">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tab-dot" hidden></span></span>
      <span>홈</span>
    </button>
    <button type="button" class="tab" data-tab="sessions">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span>대회</span>
    </button>
    <button type="button" class="tab" data-tab="hands">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="11" height="16" rx="2" transform="rotate(-8 8 12)"/><rect x="10" y="4" width="11" height="16" rx="2" transform="rotate(8 16 12)"/></svg></span>
      <span>핸드</span>
    </button>
    <button type="button" class="tab" data-tab="stats">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      <span>통계</span>
    </button>
  </nav>

  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>이 앱은 JavaScript가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
